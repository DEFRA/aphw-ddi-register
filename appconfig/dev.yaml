---
environment: production
environmentCode: dev
container:
  redisHostname: DEVFFCINFRD1001.redis.cache.windows.net
  redisPort: 6380
ingress:
  server: azure.defra.cloud
  endpoint: aphw-ddi-register-dev
secretProviderClass:
  azure:
    keyvaultName: DEVFFCINFKV1001
    objects:
      - objectName: devtest-ffcahwr-appInsights-connectionString
        objectType: secret
      - objectName: dev-redisPassword
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-register
      type: Opaque
      data:
        - objectName: devtest-ffcahwr-appInsights-connectionString
          key: APPINSIGHTS_CONNECTIONSTRING
        - objectName: dev-redisPassword
          key: REDIS_PASSWORD
